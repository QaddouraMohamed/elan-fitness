<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Élan Fitness, salle de sport à Casablanca : musculation, yoga, cardio et boxe fitness avec des coachs diplômés. Réservez votre cours d'essai gratuit.">
    <title>Élan Fitness | Salle de sport à Casablanca</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="../index.html" class="logo">Élan Fitness</a>

            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="../index.html">Accueil</a></li>
                    <li><a href="./about.html">À propos</a></li>
                    <li><a href="./programmes.html">Programmes</a></li>
                    <li><a href="#contact" class="lien-actif">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section id="contact" class="section">

            <div class="grid-conteneur">
                <h2 class="section-titre">Contactez Nous</h2>
                <div class="conteneur">
                    <form class="formule">
                        <label for="nom">Nom</label>
                        <input type="text" name="nom" id="nom" placeholder="Entrer votre nom" class="texts"><br>
                        <label for="email">E-mail</label>
                        <input type="email" name="email" id="email" placeholder="Entrer votre email" class="texts"><br>
                        <label for="message">Message</label>
                        <textarea name="message" id="message"
                            placeholder="Faites-nous part de vos besoins"></textarea><br>
                        <input type="submit" value="Envoyer!" class="bouton bouton-principal"><br>
                    </form>
                </div>


            </div>
            <img src="../assets/images/equipe.jpg" alt="">

        </section>

    </main>

    <footer class="pied-de-page">
        <div class="conteneur">

            <div class="pied-haut">
                <div>
                    <p class="logo logo-clair">Élan Fitness</p>
                    <p class="slogan">Ton énergie, ton rythme.</p>
                </div>

                <nav aria-label="Navigation du pied de page">
                    <ul class="menu menu-pied">
                        <li><a href="../index.html">Accueil</a></li>
                        <li><a href="./about.html">À propos</a></li>
                        <li><a href="./programmes.html">Programmes</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </nav>
            </div>

            <div class="pied-bas">
                <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
                <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
            </div>

        </div>
    </footer>

</body>

</html>
